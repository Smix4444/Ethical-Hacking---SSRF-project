# =============================================================================
#  SSRF Lab — docker-compose  (Phase 1, defense level L0: no protections yet)
#
#  Start everything in one go:   docker compose up --build
#  Stop and clean up:            docker compose down
#
#  Topology
#  --------
#    browser (host) ──:8080──▶ vulnerable-app (Flask, L0)
#                                     │  SSRF: the app fetches ANY URL you give it
#                                     ▼
#                         metadata-service @ 169.254.169.254:80
#                         (mock AWS IMDS, FAKE credentials)
#
#  The metadata service has NO published ports on purpose: it is reachable ONLY
#  from inside the lab network, exactly like a real cloud metadata endpoint.
#  That is what makes SSRF powerful — the app can reach it even though you,
#  from the host, cannot.
# =============================================================================

name: ssrf-lab

services:
  # ---- The intentionally vulnerable web app (what the "attacker" talks to) --
  vulnerable-app:
    build: ./vulnerable-app
    container_name: ssrf-vulnerable-app
    ports:
      # host 8080 -> container 5000. If 8080 is busy, change ONLY the left
      # number (e.g. "8090:5000") and browse to that port instead.
      - "8080:5000"
    networks:
      - ssrflab
    depends_on:
      - metadata-service
    restart: unless-stopped

  # ---- The mock cloud metadata service (the internal "crown jewel" target) --
  metadata-service:
    build: ./metadata-service
    container_name: ssrf-metadata-service
    # NOTE: deliberately NO "ports:" — not reachable from the host, only via SSRF.
    networks:
      ssrflab:
        # Pin the realistic AWS metadata IP so http://169.254.169.254/ "just works".
        ipv4_address: 169.254.169.254
    restart: unless-stopped

networks:
  ssrflab:
    driver: bridge
    ipam:
      config:
        # Link-local range, isolated inside Docker's VM; does not touch your
        # real Windows network. Lets us assign the authentic 169.254.169.254.
        - subnet: 169.254.169.0/24
          gateway: 169.254.169.1
