# =============================================================================
#  SSRF Lab — docker-compose  (Phase 4: WAF layer in front of the app)
#
#  Start everything in one go:   docker compose up --build
#  Stop and clean up:            docker compose down
#
#  Topology — two ways in, so you can compare WITH vs WITHOUT the WAF
#  ------------------------------------------------------------------
#    browser (host) ──:8090──▶ waf (ModSecurity + OWASP CRS) ──┐
#    browser (host) ──:8088──────────────────────────────────▶ vulnerable-app (Flask, L0-L3)
#                                     │  SSRF: the app fetches a URL you give it
#                     ┌───────────────┼───────────────────────────┐
#                     ▼               ▼                           ▼
#        metadata-service    preview-service.lab           (alt IP encodings
#        169.254.169.254:80  (redirector, 302 ──┐           all resolve to the
#        alias metadata.lab                      └─▶ 169.254.169.254)
#        (mock AWS IMDS, FAKE credentials)
#
#  Only vulnerable-app (:8088) and the WAF (:8090) publish host ports. The
#  metadata service and the redirector have NO published ports — reachable only
#  from inside the lab. The WAF only proxies to the app, never to metadata.
# =============================================================================

name: ssrf-lab

services:
  # ---- The intentionally vulnerable web app (what the "attacker" talks to) --
  vulnerable-app:
    build: ./vulnerable-app
    container_name: ssrf-vulnerable-app
    ports:
      # host 8088 -> container 5000. Port 8080 is a very common clash (other
      # local stacks grab it), so the lab defaults to 8088. If 8088 is also
      # busy, change ONLY the left number (e.g. "9080:5000") and browse there.
      - "8088:5000"
    environment:
      # Default defense level when no ?level= is given. The UI dropdown overrides
      # it per request, so you can switch L0/L1/L2 live without a rebuild.
      DEFENSE_LEVEL: "0"
    # Point the app's resolver at our rebinding DNS server. It answers rebind.lab
    # with the TTL-0 flip and FORWARDS everything else to Docker's resolver, so
    # all other names (metadata.lab, cdn-assets.lab, service names, internet)
    # keep resolving exactly as before — the earlier phases are unaffected.
    dns:
      - 169.254.169.53
    networks:
      - ssrflab
    depends_on:
      - metadata-service
      - redirector
      - dns-rebind
    restart: unless-stopped

  # ---- The mock cloud metadata service (the internal "crown jewel" target) --
  metadata-service:
    build: ./metadata-service
    container_name: ssrf-metadata-service
    environment:
      # IMDS_MODE: "v1" (legacy, plain GET leaks creds — default, keeps earlier
      # demos working) or "v2" (requires the PUT-token dance). Reads the host
      # env var if set, else defaults to v1, so you can flip without editing:
      #   PowerShell:  $env:IMDS_MODE="v2"; docker compose up -d metadata-service
      IMDS_MODE: "${IMDS_MODE:-v1}"
    # NOTE: deliberately NO "ports:" — not reachable from the host, only via SSRF.
    networks:
      ssrflab:
        # Pin the realistic AWS metadata IP so http://169.254.169.254/ "just works".
        ipv4_address: 169.254.169.254
        # DNS names that resolve to the metadata IP. `metadata.lab` looks
        # obviously suspicious (L2's regex catches it); `cdn-assets.lab` looks
        # innocent (L2 allows it, never resolves it) — a DNS-based bypass,
        # simulating an attacker domain whose A record points at the target.
        aliases:
          - metadata.lab
          - cdn-assets.lab
    restart: unless-stopped

  # ---- Attacker redirector (lab component): innocent host that 302s inward ---
  redirector:
    build: ./redirector
    container_name: ssrf-redirector
    # NO published ports either — only the vulnerable app reaches it, by name.
    networks:
      ssrflab:
        aliases:
          - preview-service.lab
    restart: unless-stopped

  # ---- OOB listener (lab component): collects callbacks to detect blind SSRF -
  oob-listener:
    build: ./oob-listener
    container_name: ssrf-oob-listener
    # NO published ports — internal only, reachable as oob-listener.lab. The
    # toolkit queries it from inside the lab network.
    networks:
      ssrflab:
        aliases:
          - oob-listener.lab
    restart: unless-stopped

  # ---- Rebinding DNS (lab component): TTL-0 flip on rebind.lab for the TOCTOU demo
  dns-rebind:
    build: ./dns-rebind
    container_name: ssrf-dns-rebind
    # Static IP so the app can use it as its resolver; also aliased for the
    # toolkit's HTTP control calls. No published host ports.
    networks:
      ssrflab:
        ipv4_address: 169.254.169.53
        aliases:
          - dns-rebind.lab
    restart: unless-stopped

  # ---- WAF: ModSecurity v3 + OWASP Core Rule Set, reverse-proxying the app ---
  waf:
    # Official OWASP CRS image (ModSecurity v3 engine + CRS v4), nginx variant.
    # NOTE: ":nginx" is a ROLLING tag. Before the Phase 7 live test, pin a dated
    # or -lts tag for reproducibility (see waf/README.md for how to find it).
    image: owasp/modsecurity-crs:nginx
    container_name: ssrf-waf
    environment:
      # Reverse-proxy target: the vulnerable app, by service name, inside the lab.
      BACKEND: "http://vulnerable-app:5000"
      PORT: "8080"                 # port nginx listens on INSIDE the container
      MODSEC_RULE_ENGINE: "On"     # On = actively block (not DetectionOnly)
      BLOCKING_PARANOIA: "1"       # CRS paranoia level 1 (fewer false positives)
    ports:
      # host 8090 -> WAF 8080. Browse here to go THROUGH the WAF; use :8088 to
      # bypass it and hit the app directly. Change 8090 if it clashes.
      - "8090:8080"
    networks:
      - ssrflab
    depends_on:
      - vulnerable-app
    restart: unless-stopped

  # ---- Dashboard (lab component): read-only SOC-style view + button-driven demos
  dashboard:
    build: ./dashboard
    container_name: ssrf-dashboard
    ports:
      # host 8099 -> container 5000. Its own port; change the left number if busy.
      - "8099:5000"
    volumes:
      # Reuse the toolkit (ssrf_scan/imds_check) read-only — no duplicated logic.
      - ./toolkit:/app/toolkit:ro
    networks:
      - ssrflab
    depends_on:
      - vulnerable-app
      - metadata-service
      - waf
      - dns-rebind
      - oob-listener
      - redirector
    restart: unless-stopped

networks:
  ssrflab:
    driver: bridge
    ipam:
      config:
        # Link-local range, isolated inside Docker's VM; does not touch your
        # real Windows network. Lets us assign the authentic 169.254.169.254.
        - subnet: 169.254.169.0/24
          gateway: 169.254.169.1
